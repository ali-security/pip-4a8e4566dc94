language: python
cache: pip
dist: xenial
python: 3.9
env:
  global:
  - PIP_INDEX_URL=https://:2021-02-01T00:00:00Z@time-machines-pypi.sealsecurity.io/
addons:
  apt:
    packages:
    - bzr

stages:
- primary
- secondary

jobs:
  include:
    # Basic Checks
    - stage: primary
      env: TOXENV=docs
    # black 20.8b1 pulls typed-ast, whose 1.4.1 cp39 wheel has a broken
    # _PyUnicode_DecodeUnicodeEscape symbol; run the lint leg on 3.8, where the
    # pinned toolchain has working wheels.
    - env: TOXENV=lint
      python: 3.8
    - env: TOXENV=vendoring

    # Complete checking for ensuring compatibility
    # PyPy
    - stage: secondary
      env: GROUP=1
      python: pypy3.5-7.0.0
    - env: GROUP=2
      python: pypy3.5-7.0.0
    - env: GROUP=1
      python: pypy2.7-7.1.1
    - env: GROUP=2
      python: pypy2.7-7.1.1

before_install: tools/travis/setup.sh
install: travis_retry tools/travis/install.sh
script: tools/travis/run.sh
